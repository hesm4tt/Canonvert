name: Release unsigned iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Select release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          [[ "$tag" == v* ]] || { echo "Release tag must start with v: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Locate Xcode project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          project="$(find . -maxdepth 3 -type d -name '*.xcodeproj' -print -quit)"
          [[ -n "$project" ]] || { echo 'No .xcodeproj found within three levels of the repository root.' >&2; exit 1; }
          echo "path=$project" >> "$GITHUB_OUTPUT"

      - name: Build unsigned archive
        shell: bash
        env:
          PROJECT_PATH: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme Digify \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Digify.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA and SideStore feed
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          scripts/package-unsigned-ipa.sh "$RUNNER_TEMP/Digify.xcarchive" "$RUNNER_TEMP/Digify.ipa"
          scripts/make-sidestore-feed.sh "$RUNNER_TEMP/Digify.ipa" "$RUNNER_TEMP/digify.json" "$TAG"
          unzip -t "$RUNNER_TEMP/Digify.ipa"
          jq -e '.apps[0] | (.bundleIdentifier == "com.hesm4tt.digify" and .category == "photo-video" and .appPermissions.entitlements == [] and (.appPermissions.privacy.NSPhotoLibraryUsageDescription | type == "string") and (.appPermissions.privacy.NSPhotoLibraryAddUsageDescription | type == "string") and (.versions[0].buildVersion | type == "string") and (.versions[0].downloadURL | type == "string"))' "$RUNNER_TEMP/digify.json" >/dev/null

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Digify $TAG" --generate-notes
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/Digify.ipa" "$RUNNER_TEMP/digify.json" --clobber
